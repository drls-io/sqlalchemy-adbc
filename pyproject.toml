[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sqlalchemy-adbc"
version = "0.9.1"
description = "Generic SQLAlchemy dialect for any ADBC driver (Flight SQL, PostgreSQL, SQLite, Snowflake, BigQuery)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "DRLS Contributors" }]
keywords = ["sqlalchemy", "adbc", "arrow", "flight-sql", "dialect"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
dependencies = [
    "sqlalchemy>=2.0",
    "adbc-driver-manager>=1.0",
    # ADBC returns results as Arrow record batches; the driver-manager
    # needs a PyArrow (or equivalent) backend installed to materialize
    # them through DBAPI. Without it, `cursor.fetchall()` raises a
    # ProgrammingError.
    "pyarrow>=14.0",
]

[project.optional-dependencies]
flightsql = ["adbc-driver-flightsql>=1.0"]
# 1.0.0 cannot run prepared statements that return result sets (#18).
postgresql = ["adbc-driver-postgresql>=1.13.0"]
sqlite = ["adbc-driver-sqlite>=1.0"]
snowflake = ["adbc-driver-snowflake>=1.0"]
bigquery = ["adbc-driver-bigquery>=1.0"]
# Kerberos / SPNEGO (auth=negotiate) on Flight SQL.
kerberos = ["pyspnego>=0.10"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    # Type stubs for pyarrow (used by the Snowflake dialect's typed binds).
    "pyarrow-stubs>=20",
    # Local matrix runner; see tox.ini.
    "tox>=4",
    "adbc-driver-sqlite>=1.0",
    # The fake Snowflake endpoint (tests/fake_snowflake) drives the real
    # driver, so every CI cell covers the Snowflake dialect end to end.
    "adbc-driver-snowflake>=1.11",
    # Flight SQL suite against the GizmoSQL service container (ci.yml).
    "adbc-driver-flightsql>=1.0",
    # pd.read_sql smoke test in the Flight SQL suite.
    "pandas>=2.0",
    # Alembic autogenerate tests (test_alembic_autogenerate.py) rely on
    # the Inspector contract we implemented in #1 — pinning the dev
    # pin ensures CI exercises that integration path.
    "alembic>=1.13",
]

[project.urls]
Homepage = "https://github.com/drls-io/sqlalchemy-adbc"
Repository = "https://github.com/drls-io/sqlalchemy-adbc"
Issues = "https://github.com/drls-io/sqlalchemy-adbc/issues"

# SQLAlchemy discovers dialects via the `sqlalchemy.dialects` entry point
# group. The name form is `<name>` or `<name>.<driver>` — the second is what
# lets us write `flightsql+adbc://` etc.
[project.entry-points."sqlalchemy.dialects"]
# SQLAlchemy URLs are <backend>+<driver>; ADBC is the driver (#15).
"flightsql.adbc" = "sqlalchemy_adbc.flightsql:ADBCFlightSQLDialect"
"sqlite.adbc" = "sqlalchemy_adbc.sqlite:ADBCSQLiteDialect"
"postgresql.adbc" = "sqlalchemy_adbc.postgresql:ADBCPostgreSQLDialect"
"snowflake.adbc" = "sqlalchemy_adbc.snowflake:ADBCSnowflakeDialect"
"bigquery.adbc" = "sqlalchemy_adbc.bigquery:ADBCBigQueryDialect"
# Deprecated adbc+<backend> spellings; removed in 1.0.
"adbc" = "sqlalchemy_adbc.base:ADBCDialect"
"adbc.flightsql" = "sqlalchemy_adbc.flightsql:ADBCFlightSQLDialect"
"adbc.sqlite" = "sqlalchemy_adbc.sqlite:ADBCSQLiteDialect"
"adbc.postgresql" = "sqlalchemy_adbc.postgresql:ADBCPostgreSQLDialect"
"adbc.snowflake" = "sqlalchemy_adbc.snowflake:ADBCSnowflakeDialect"
"adbc.bigquery" = "sqlalchemy_adbc.bigquery:ADBCBigQueryDialect"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlalchemy_adbc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
# Matches requires-python. (numpy's stubs, reached through pyarrow-stubs
# once pandas is installed, need at least 3.12 to parse anyway.)
python_version = "3.12"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
follow_imports = "silent"

# ADBC driver wheels don't ship type stubs; lazy imports in the dialect
# modules guard on ImportError so we only pay the type-ignore cost here.

[[tool.mypy.overrides]]
module = [
    "spnego.*",  # optional `kerberos` extra, imported lazily
    "adbc_driver_manager.*",
    "adbc_driver_flightsql.*",
    "adbc_driver_postgresql.*",
    "adbc_driver_sqlite.*",
    "adbc_driver_snowflake.*",
    "adbc_driver_bigquery.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
# Marks SQLAlchemy's dialect compliance suite (suite/) applies; registered so
# pytest does not warn about them.
markers = [
    "backend: tests that run against a real database backend",
    "sparse_driver_backend: tests that run against a subset of drivers",
    "mypy: SQLAlchemy mypy plugin tests",
]
