# Configuration for SQLAlchemy's dialect compliance suite (suite/). Plain
# pytest ignores this file's [sqla_testing] section; see suite/conftest.py.
[sqla_testing]
requirement_cls = requirements:Requirements
profile_file = suite/profiles.txt

[db]
default = sqlite+adbc:///suite_sqlite_adbc.db
sqlite_adbc = sqlite+adbc:///suite_sqlite_adbc.db
