# Local test matrix. CI (.github/workflows/ci.yml) installs the dev extra
# directly; tox is for running the same gates across interpreters locally.
#
#   tox                 # every env below that has an interpreter available
#   tox -e lint,type    # ruff + mypy only
#   tox -e py312-sa21   # one cell of the matrix
#
# SQLAlchemy 2.1 and ADBC 1.13 require Python >= 3.11, so sa21 cells skip 3.10.
[tox]
min_version = 4
env_list = py310-sa20, py{311,312,313}-sa{20,21}, lint, type
skip_missing_interpreters = true

[testenv]
description = pytest on {base_python} with SQLAlchemy {env:SA_SERIES}
extras = dev, postgresql
deps =
    sa20: sqlalchemy>=2.0,<2.1
    sa21: sqlalchemy>=2.1,<2.2
pass_env =
    DRLS_PG_URL
    DRLS_SNOWFLAKE_URL
    DRLS_FLIGHTSQL_URL
set_env =
    sa20: SA_SERIES = 2.0
    sa21: SA_SERIES = 2.1
commands =
    pytest {posargs:tests/ -q}

[testenv:lint]
description = ruff check + ruff format --check
skip_install = true
deps = ruff>=0.6
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:type]
description = mypy over src and tests
extras = dev
commands =
    mypy src tests
