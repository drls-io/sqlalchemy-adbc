name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Ruff format
        run: ruff format --check src/ tests/
      - name: Mypy
        run: mypy src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matrix tracks active Python versions only — 3.10 hit EOL in
        # October 2026, so it's dropped. Bump when a new minor ships;
        # drop when Python marks one end-of-life.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    # Postgres service for integration tests (test_postgresql_types.py,
    # issue #3). Gated by DRLS_PG_URL — tests skip when the env var is
    # absent, so local `pytest` runs without a local PG also pass.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Flight SQL server for tests/test_flightsql_e2e.py: GizmoSQL (DuckDB
      # backend), plaintext gRPC on 31337. Pinned tag; bump deliberately. No
      # Docker health command — the image guarantees no curl/wget — so the
      # test fixture retries the first connection for up to 60 s instead.
      gizmosql:
        image: gizmodata/gizmosql:v1.42.2
        env:
          GIZMOSQL_USERNAME: ci
          GIZMOSQL_PASSWORD: ci-password
          TLS_ENABLED: "0"
          PRINT_QUERIES: "0"
          DATABASE_BACKEND: duckdb
        ports:
          - 31337:31337
    env:
      DRLS_PG_URL: "postgresql+adbc://test:test@localhost:5432/test"
      DRLS_FLIGHTSQL_URL: "flightsql+adbc://ci:ci-password@localhost:31337?auth=basic&tls=false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,postgresql]"
      - name: Pytest
        # -rs lists skips so a gated suite that silently skipped is visible.
        run: pytest tests/ -rs --cov=sqlalchemy_adbc --cov-report=term-missing
